services:
  backend:
    image: notion_job_tracker:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8000'
    deploy:
      replicas: 1
    volumes:
      - backend_notion_job_tracker_node_modules:/app/node_modules
      - notion_job_tracker_assets:/app/public
    networks:
      - traefik-proxy
    env_file:
      - .env
    environment:
      - ROOT_PATH=/app
      - APP_HOST=0.0.0.0
    labels:
      - 'traefik.enable=true'
      # Replace 'yourdomain.com' with your actual domain
      - 'traefik.http.routers.notion_job_tracker.rule=Host(`job-tracker.binay-shrestha.com.np`)'
      - 'traefik.http.routers.notion_job_tracker.entrypoints=web'
      # Tell Traefik which port the Node app is listening on inside the container
      - 'traefik.http.services.notion_job_tracker.loadbalancer.server.port=8000'
      - 'traefik.docker.network=traefik-proxy'
volumes:
  backend_notion_job_tracker_node_modules:
    external: true
  notion_job_tracker_assets:
    external: true
networks:
  traefik-proxy:
    external: true
